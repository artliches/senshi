<div class="section-layout">
    <div class="section-header">
        <h2>YOU ARE 
            <div
                (click)="rerollAllObjects()"
                class="clickable shake header"
            >
                {{ firstNameObj.descrip | uppercase }}
            </div> THE {{ currentJobName() | uppercase}}</h2>
    </div>
    <div class="section-body">
        <div>
            Carve your name into the endless night:
            <strong (click)="firstNameObj = reroll(firstNameArray, firstNameObj)" class="clickable shake">{{firstNameObj.descrip}}</strong>
            <strong (click)="lastNameObj = reroll(lastNameArray, lastNameObj)" class="clickable shake">{{lastNameObj.descrip}}</strong>
            <strong (click)="nickNameObj = reroll(nickNameArray, nickNameObj)" class="clickable shake">{{nickNameObj.descrip}}</strong>
        </div>
    </div>
</div>
